<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex" />
<title>Panel de gestión · Bryan la Tinta</title>
<link rel="cms-config-url" href="config.yml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#0b0b0c;--carbon:#151517;--line:#2c2c30;--bone:#ebe6dc;--smoke:#9a968e;--red:#d6262e;--red2:#ff3b43}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
h1{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px;font-size:30px;line-height:1}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--carbon);border:1px solid var(--line);border-radius:6px;padding:36px 32px}
.logo{height:28px;margin-bottom:24px;filter:invert(1);display:block}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);font-weight:600;margin:0 0 14px}
.sub{color:var(--smoke);margin:0 0 26px;font-size:15px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);font-weight:600;margin-bottom:6px}
.field{margin-bottom:18px}
input{width:100%;font:inherit;font-size:16px;color:var(--bone);background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
input:focus{outline:2px solid var(--red2);outline-offset:2px}
button{width:100%;background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px;font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;margin-top:6px;font-family:inherit}
button:hover{background:var(--red2)}
button:disabled{opacity:.6;cursor:default}
.err{color:#ff8a8f;font-size:14px;margin-top:14px;display:none}

/* ===== Reskin del editor Decap CMS con la marca de Bryan la Tinta ===== */
html,body{background:var(--ink) !important}
#nc-root, [class*="AppMainContainer"]{background:var(--ink) !important;min-height:100vh}
#nc-root, [class*="AppMainContainer"], [class*="EditorContainer"], [class*="CollectionMain"]{color:var(--bone) !important;font-family:Barlow,"Helvetica Neue",Arial,sans-serif !important}
#nc-root h1,#nc-root h2,#nc-root h3{font-family:Anton,Impact,"Arial Narrow",sans-serif !important;font-weight:400 !important;text-transform:uppercase;letter-spacing:.02em}

/* Cabecera superior (Contenido / Medios / usuario) */
[class*="AppHeader"]{background:var(--carbon) !important;border-bottom:1px solid var(--line) !important;box-shadow:none !important}
[class*="AppHeaderNavLink"],[class*="AppHeaderButton"]{color:var(--smoke) !important;font-weight:600 !important;letter-spacing:.04em}
[class*="AppHeaderNavLink"].header-link-active,[class*="AppHeaderButton"].header-link-active,[class*="AppHeaderNavLink"][class*="buttonActive"]{color:var(--red2) !important}
[class*="AppHeader"] svg{fill:var(--bone) !important;color:var(--bone) !important}

/* Paneles/tarjetas blancas (sidebar de colecciones, listados, cabecera de colección) */
[class*="-card-"],[class*="cardTop"],[class*="CollectionTopContainer"]{background:var(--carbon) !important;border:1px solid var(--line) !important;box-shadow:none !important;color:var(--bone) !important}
[class*="SidebarHeading"]{color:var(--smoke) !important;font-family:Anton,Impact,sans-serif !important;text-transform:uppercase;letter-spacing:.04em}
[class*="SidebarNavLink"]{color:var(--bone) !important;background:transparent !important}
[class*="SidebarNavLink"].sidebar-active,[class*="SidebarNavLink"][class*="sidebarNavLinkActive"]{color:var(--red2) !important;font-weight:600;background:rgba(255,59,67,.08) !important;border-left:3px solid var(--red2) !important}
[class*="SidebarNavLink"]:hover{color:var(--red2) !important}

/* Filas de entradas / tarjetas de listado */
[class*="ListItem"],[class*="listControlItem"],[class*="EntryListing"],[class*="CardsGridContainer"] > *{background:var(--carbon) !important;border:1px solid var(--line) !important;color:var(--bone) !important}
[class*="ListItem"]:hover{border-color:var(--red2) !important}

/* Barra de herramientas del editor (Publicar, vista previa, etc.) */
[class*="ToolbarContainer"]{background:var(--carbon) !important;border-bottom:1px solid var(--line) !important;box-shadow:none !important}
[class*="ToolbarContainer"] *{color:var(--bone)}
[class*="PublishedButton"],[class*="ToolbarButton"]{background:transparent !important;color:var(--bone) !important;border:1px solid var(--line) !important}
[class*="ToolbarButton"][class*="default-default"]:not([class*="Published"]){background:var(--red) !important;color:#fff !important;border:0 !important}
[class*="RefreshPreviewButton"],[class*="ExpandButton"],[class*="EditorToggle"]{color:var(--smoke) !important}
[class*="RefreshPreviewButton"]:hover,[class*="ExpandButton"]:hover,[class*="EditorToggle"]:hover{color:var(--red2) !important}
[class*="AddButton"]{background:var(--red) !important;color:#fff !important;border:0 !important;border-radius:3px !important}
[class*="AddButton"]:hover{background:var(--red2) !important}

/* Panel de edición (fondo entre tarjetas) y vista previa */
[class*="ControlPaneContainer"],[class*="PreviewPaneContainer"],[class*="EditorContainer"]{background:var(--ink) !important}

/* Campos de formulario */
#nc-root label{color:var(--smoke) !important;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
#nc-root input[type="text"],#nc-root input[type="email"],#nc-root input[type="search"],#nc-root input[type="number"],#nc-root textarea,#nc-root select{background:var(--ink) !important;color:var(--bone) !important;border:1px solid var(--line) !important;border-radius:3px !important}
#nc-root input:focus,#nc-root textarea:focus,#nc-root select:focus{outline:2px solid var(--red2) !important;outline-offset:1px}

/* Widget de lista (fotos) */
[class*="SortableListItem"]{background:var(--carbon) !important;border:1px solid var(--line) !important}
[class*="ObjectWidgetTopBar"]{background:var(--carbon) !important;color:var(--bone) !important;border-bottom:1px solid var(--line) !important}
[class*="FieldLabel"],[class*="TopBarContainer"],[class*="NestedObjectLabel"]{background:var(--carbon) !important;color:var(--bone) !important}
[class*="TopBarContainer"] *,[class*="NestedObjectLabel"] *{color:var(--bone) !important}

/* Biblioteca de medios (modal) */
[class*="MediaLibrary"],[role="dialog"]{background:var(--carbon) !important;color:var(--bone) !important}
[class*="MediaLibrary"] input{background:var(--ink) !important;color:var(--bone) !important;border:1px solid var(--line) !important}
[class*="MediaLibrary"] button{border-radius:3px}
</style>
</head>
<body>
<div id="login-screen">
  <div class="card">
    <img class="logo" src="/logo.png" alt="Bryan la Tinta">
    <p class="eyebrow">Panel</p>
    <h1>Iniciar sesión</h1>
    <p class="sub">Accede al panel de gestión de Bryan la Tinta.</p>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="pass">Contraseña</label><input id="pass" type="password" required autocomplete="current-password"></div>
      <button type="submit" id="submit-btn">Entrar</button>
      <p class="err" id="err"></p>
    </form>
  </div>
</div>

<script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/gotrue-js@0.9.30/dist/gotrue.min.js"></script>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
(function(){
  var IDENTITY_URL = 'https://rotulito-bryanlatinta-cms.netlify.app/.netlify/identity';
  var auth = new GoTrue({ APIUrl: IDENTITY_URL, setCookie: true });
  if (window.netlifyIdentity && window.netlifyIdentity.init) {
    window.netlifyIdentity.init({ APIUrl: IDENTITY_URL });
    if (window.netlifyIdentity.gotrue && window.netlifyIdentity.gotrue.api) {
      window.netlifyIdentity.gotrue.api.apiURL = IDENTITY_URL;
    }
  }

  var screen = document.getElementById('login-screen');
  var form = document.getElementById('login-form');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submit-btn');

  function startCMS(){
    screen.style.display = 'none';
    if (window.CMS && window.CMS.init) window.CMS.init();
  }

  if (auth.currentUser()) {
    startCMS();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Entrando…';
    var email = document.getElementById('email').value;
    var pass = document.getElementById('pass').value;
    auth.login(email, pass, true).then(function(){
      window.location.reload();
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Entrar';
      errEl.textContent = 'Email o contraseña incorrectos.';
      errEl.style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
